<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The City We Live In — Lisboa</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --pink: #F472B6;
  --blue: #38BFFF;
  --yellow: #FFD700;
  --coral: #FF6B6B;
  --teal: #2DD4BF;
  --green: #4ADE80;
  --cream: #FFF8F0;
  --ink: #1E1B18;
  --lilac: #C4B5FD;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Nunito', sans-serif;
  overflow-x: hidden;
}

/* wavy background dots */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(244,114,182,.08) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  z-index: 0;
}

/* LANG BAR */
.lang-bar {
  background: var(--ink);
  padding: .5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}
.lang-logo {
  font-family: 'Fredoka One', cursive;
  color: var(--yellow);
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}
.dot-blink {
  width: 9px; height: 9px;
  background: var(--coral);
  border-radius: 50%;
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.lang-pills { display: flex; gap: .3rem; }
.lp {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,.2);
  color: rgba(255,255,255,.55);
  padding: .2rem .55rem;
  border-radius: 100px;
  font-size: .72rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.lp:hover { border-color: var(--yellow); color: var(--yellow); }
.lp.active { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.2rem 3rem;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--cream);
  border-bottom: 3px solid var(--ink);
}
.nav-title {
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem;
  color: var(--ink);
  letter-spacing: .02em;
}
.nav-title span { color: var(--coral); }
nav ul { list-style: none; display: flex; gap: 1.5rem; align-items: center; }
nav a { text-decoration: none; color: var(--ink); font-size: .9rem; font-weight: 700; transition: color .2s; }
nav a:hover { color: var(--pink); }
.nav-cta {
  background: var(--coral);
  color: #fff !important;
  padding: .45rem 1.2rem;
  border-radius: 100px;
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform .15s, box-shadow .15s !important;
}
.nav-cta:hover { transform: translate(-2px,-2px) !important; box-shadow: 5px 5px 0 var(--ink) !important; color:#fff !important; }

/* HERO */
.hero {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 4rem 3rem 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: center;
}
.hero-eyebrow {
  display: inline-block;
  background: var(--yellow);
  color: var(--ink);
  font-weight: 800;
  font-size: .75rem;
  padding: .3rem 1rem;
  border-radius: 100px;
  border: 2.5px solid var(--ink);
  margin-bottom: 1.2rem;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.hero h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  line-height: 1.1;
  margin-bottom: 1.2rem;
  color: var(--ink);
}
.hero h1 .hl-pink { color: var(--pink); }
.hero h1 .hl-blue { color: var(--blue); }
.hero h1 .hl-coral { color: var(--coral); }
.hero-desc {
  font-size: 1.05rem;
  line-height: 1.75;
  color: #4A3F38;
  margin-bottom: 2rem;
  font-weight: 600;
}
.hero-desc em { color: var(--coral); font-style: normal; font-weight: 800; }
.hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; }
.btn-main {
  background: var(--blue);
  color: var(--ink);
  border: 2.5px solid var(--ink);
  padding: .8rem 1.8rem;
  border-radius: 100px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  box-shadow: 4px 4px 0 var(--ink);
  transition: transform .15s, box-shadow .15s;
}
.btn-main:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 2.5px solid var(--ink);
  padding: .8rem 1.8rem;
  border-radius: 100px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  box-shadow: 4px 4px 0 var(--ink);
  transition: transform .15s, box-shadow .15s, background .15s;
}
.btn-ghost:hover { background: var(--lilac); transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }

/* HERO ILLUSTRATION */
.hero-illustration {
  position: relative;
  height: 460px;
}
.hero-card {
  background: white;
  border: 3px solid var(--ink);
  border-radius: 28px;
  width: 100%;
  height: 100%;
  position: relative;
  overflow: visible;
  box-shadow: 8px 8px 0 var(--ink);
}
#hero-map {
  width: 100%;
  height: 100%;
  border-radius: 25px;
  z-index: 1;
}
#map-search-bar {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  border: 2.5px solid var(--ink);
  border-radius: 100px;
  padding: 7px 16px;
  box-shadow: 3px 3px 0 var(--ink);
}
#map-search {
  border: none;
  outline: none;
  flex: 1;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  background: transparent;
  color: var(--ink);
}
#map-search::placeholder { color: #9B8E88; }
.leaflet-popup-content-wrapper {
  border: 2.5px solid var(--ink) !important;
  border-radius: 16px !important;
  box-shadow: 4px 4px 0 var(--ink) !important;
  padding: 0 !important;
}
.leaflet-popup-content { margin: 14px 16px !important; }
.leaflet-popup-tip-container { display: none; }

.map-overlay-pin {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  animation: float 3s ease-in-out infinite;
  z-index: 5;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.map-overlay-pin:nth-child(2) { animation-delay: .5s; }
.map-overlay-pin:nth-child(3) { animation-delay: 1s; }
.map-overlay-pin:nth-child(4) { animation-delay: 1.5s; }

.pin-bubble {
  width: 42px; height: 42px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2.5px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 3px 3px 0 var(--ink);
  font-size: 18px;
}
.pin-bubble span { transform: rotate(45deg); line-height: 1; }
.pin-label-pop {
  margin-top: 5px;
  background: white;
  border: 2px solid var(--ink);
  border-radius: 10px;
  padding: 3px 9px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 2px 2px 0 var(--ink);
  font-family: 'Nunito', sans-serif;
}

/* floating hearts/stars deco */
.deco {
  position: absolute;
  font-size: 1.4rem;
  animation: spin-float 4s ease-in-out infinite;
  z-index: 6;
  pointer-events: none;
}
@keyframes spin-float { 0%,100%{transform:rotate(0deg) translateY(0)} 50%{transform:rotate(15deg) translateY(-8px)} }

/* STATS STRIP */
.stats-strip {
  background: var(--ink);
  padding: 1.2rem 3rem;
  display: flex;
  justify-content: center;
  gap: 4rem;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}
.stat-item { text-align: center; }
.stat-num {
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  color: var(--yellow);
  display: block;
  line-height: 1;
}
.stat-label { font-size: .75rem; color: rgba(255,255,255,.6); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

/* WHAT DOES LISBON MEAN */
.question-section {
  background: var(--pink);
  border-top: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
  padding: 3.5rem 3rem;
  position: relative;
  z-index: 1;
  overflow: hidden;
}
.question-section::after {
  content: '♥ ♪ ★ ♥ ♪ ★ ♥ ♪ ★ ♥ ♪ ★';
  position: absolute;
  bottom: .8rem;
  left: 0; right: 0;
  text-align: center;
  font-size: .85rem;
  color: rgba(255,255,255,.4);
  letter-spacing: .5em;
}
.question-inner { max-width: 800px; margin: 0 auto; text-align: center; }
.question-title {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: white;
  line-height: 1.15;
  margin-bottom: 1rem;
  text-shadow: 3px 3px 0 var(--ink);
}
.question-title span { color: var(--yellow); }
.question-sub {
  font-size: 1.1rem;
  color: rgba(255,255,255,.9);
  font-weight: 700;
  line-height: 1.7;
  margin-bottom: 2rem;
}
.question-sub strong { color: var(--yellow); }

/* HOW IT WORKS */
.how-section { max-width: 1200px; margin: 0 auto; padding: 5rem 3rem; position: relative; z-index: 1; }
.section-eyebrow {
  font-family: 'Fredoka One', cursive;
  font-size: .9rem;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: .12em;
  margin-bottom: .6rem;
  display: block;
}
.section-title {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2rem, 3.5vw, 2.8rem);
  margin-bottom: 3rem;
  line-height: 1.2;
}
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1.5rem; }
.step-card {
  background: white;
  border: 3px solid var(--ink);
  border-radius: 24px;
  padding: 1.8rem 1.5rem;
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform .2s, box-shadow .2s;
  position: relative;
  overflow: hidden;
}
.step-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  border-radius: 24px 24px 0 0;
}
.step-card:nth-child(1)::before { background: var(--coral); }
.step-card:nth-child(2)::before { background: var(--blue); }
.step-card:nth-child(3)::before { background: var(--teal); }
.step-card:nth-child(4)::before { background: var(--pink); }
.step-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 var(--ink); }
.step-emoji { font-size: 2.2rem; display: block; margin-bottom: .6rem; }
.step-num {
  font-family: 'Fredoka One', cursive;
  font-size: 3rem;
  line-height: 1;
  margin-bottom: .4rem;
}
.step-card:nth-child(1) .step-num { color: var(--coral); }
.step-card:nth-child(2) .step-num { color: var(--blue); }
.step-card:nth-child(3) .step-num { color: var(--teal); }
.step-card:nth-child(4) .step-num { color: var(--pink); }
.step-title { font-weight: 800; font-size: 1.05rem; margin-bottom: .4rem; }
.step-desc { font-size: .88rem; line-height: 1.65; color: #5A4F48; font-weight: 600; }

/* STORIES */
.stories-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 5rem 3rem;
  position: relative; z-index: 1;
}
.stories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 1.5rem;
  margin-top: 2.5rem;
}
.story-card {
  background: white;
  border: 3px solid var(--ink);
  border-radius: 24px;
  padding: 1.4rem;
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform .2s, box-shadow .2s;
}
.story-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 var(--ink); }
.story-top { display: flex; align-items: center; gap: .7rem; margin-bottom: .8rem; }
.story-avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 2.5px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}
.story-nick { font-weight: 800; font-size: .9rem; }
.story-from { font-size: .75rem; color: #7A6E68; font-weight: 600; }
.story-place {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--yellow);
  border: 2px solid var(--ink);
  border-radius: 100px;
  padding: 2px 10px;
  font-size: .72rem;
  font-weight: 800;
  margin-bottom: .7rem;
}
.story-quote {
  font-size: .9rem;
  line-height: 1.65;
  color: var(--ink);
  font-weight: 600;
  font-style: italic;
}
.story-word {
  display: inline-block;
  margin-top: .8rem;
  background: var(--coral);
  color: white;
  border: 2px solid var(--ink);
  border-radius: 100px;
  padding: .2rem .8rem;
  font-family: 'Fredoka One', cursive;
  font-size: .9rem;
  box-shadow: 2px 2px 0 var(--ink);
}
.story-player {
  margin-top: .8rem;
  background: var(--cream);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: .5rem .8rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  cursor: pointer;
}
.play-circle {
  width: 28px; height: 28px;
  background: var(--coral);
  border-radius: 50%;
  border: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 10px;
  color: white;
}
.play-bar { flex: 1; height: 4px; background: #ddd; border-radius: 2px; overflow: hidden; }
.play-fill { height: 100%; background: var(--coral); border-radius: 2px; }
.play-time { font-size: 11px; color: #888; font-weight: 700; }

/* CTA */
.cta-section {
  background: var(--ink);
  padding: 5rem 3rem;
  text-align: center;
  position: relative;
  z-index: 1;
  overflow: hidden;
}
.cta-section::before {
  content: '★ ♥ ★ ♥ ★ ♥ ★ ♥ ★ ♥ ★ ♥ ★';
  position: absolute;
  top: 1rem;
  left: 0; right: 0;
  text-align: center;
  font-size: .85rem;
  color: rgba(255,255,255,.12);
  letter-spacing: .6em;
}
.cta-inner { max-width: 640px; margin: 0 auto; }
.cta-section h2 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2rem, 4vw, 3rem);
  color: white;
  margin-bottom: 1rem;
  line-height: 1.2;
}
.cta-section h2 span { color: var(--yellow); }
.cta-section p { color: rgba(255,255,255,.7); font-size: 1.05rem; line-height: 1.7; font-weight: 600; margin-bottom: 2rem; }
.cta-section p strong { color: var(--pink); font-weight: 800; }
.cta-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
.btn-yellow {
  background: var(--yellow);
  color: var(--ink);
  border: 2.5px solid white;
  padding: .85rem 2rem;
  border-radius: 100px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  box-shadow: 4px 4px 0 white;
  transition: transform .15s, box-shadow .15s;
}
.btn-yellow:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 white; }
.btn-white-ghost {
  background: transparent;
  color: white;
  border: 2.5px solid rgba(255,255,255,.4);
  padding: .85rem 2rem;
  border-radius: 100px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: border-color .2s, background .2s;
}
.btn-white-ghost:hover { border-color: white; background: rgba(255,255,255,.08); }

/* FOOTER */
footer {
  background: var(--cream);
  border-top: 3px solid var(--ink);
  padding: 2rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  position: relative; z-index: 1;
}
.foot-logo { font-family: 'Fredoka One', cursive; font-size: 1.1rem; }
footer p { font-size: .82rem; color: #7A6E68; font-weight: 600; }
.foot-links { display: flex; gap: 1.5rem; }
.foot-links a { font-size: .82rem; color: var(--ink); text-decoration: none; font-weight: 700; }
.foot-links a:hover { color: var(--pink); }

/* QUOTE STRIP */
.quote-strip {
  background: var(--teal);
  border-top: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
  padding: 2.5rem 3rem;
  text-align: center;
  position: relative; z-index: 1;
}
.quote-strip blockquote {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.1rem, 2.5vw, 1.6rem);
  color: white;
  text-shadow: 2px 2px 0 rgba(0,0,0,.2);
  max-width: 800px;
  margin: 0 auto;
  line-height: 1.4;
}
.quote-strip blockquote em { color: var(--yellow); font-style: normal; }

/* RESPONSIVE */
@media(max-width: 768px) {
  nav { padding: 1rem 1.5rem; }
  nav ul { display: none; }
  .hero { grid-template-columns: 1fr; padding: 2.5rem 1.5rem; gap: 2rem; }
  .hero-illustration { height: 280px; }
  .how-section, .stories-section { padding: 3rem 1.5rem; }
  .pins-section, .question-section, .cta-section { padding: 3rem 1.5rem; }
  footer { padding: 1.5rem; flex-direction: column; align-items: flex-start; }
  .stats-strip { gap: 2rem; padding: 1.2rem 1.5rem; }
}

/* ADD PIN MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(30,27,24,.55);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 28px;
  padding: 2rem;
  max-width: 420px;
  width: 90%;
  box-shadow: 8px 8px 0 var(--ink);
  position: relative;
}
.modal-close {
  position: absolute;
  top: 12px; right: 16px;
  background: none; border: none;
  font-size: 1.5rem; cursor: pointer;
  color: var(--ink); line-height: 1;
}
.modal-title {
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem;
  margin-bottom: .3rem;
  color: var(--ink);
}
.modal-place {
  font-size: .82rem;
  color: #7A6E68;
  font-weight: 600;
  margin-bottom: 1.4rem;
}
.modal-label {
  display: block;
  font-weight: 800;
  font-size: .82rem;
  margin-bottom: .3rem;
  margin-top: .9rem;
  color: var(--ink);
}
.modal-input, .modal-select, .modal-textarea {
  width: 100%;
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  padding: .6rem .9rem;
  font-family: 'Nunito', sans-serif;
  font-size: .9rem;
  font-weight: 600;
  background: white;
  color: var(--ink);
  outline: none;
  transition: box-shadow .15s;
}
.modal-input:focus, .modal-select:focus, .modal-textarea:focus { box-shadow: 3px 3px 0 var(--ink); }
.modal-textarea { resize: vertical; min-height: 80px; }
.modal-submit {
  width: 100%;
  margin-top: 1.3rem;
  background: var(--coral);
  color: white;
  border: 2.5px solid var(--ink);
  border-radius: 100px;
  padding: .75rem;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
  transition: transform .15s, box-shadow .15s;
}
.modal-submit:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
.modal-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--ink); }

/* Entrance animations */
@keyframes slideUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
.hero-left > * { animation: slideUp .6s ease both; }
.hero-left > *:nth-child(1){animation-delay:.1s}

  maxZoom: 19
}).addTo(lisbonMap);

L.control.zoom({ position: 'bottomright' }).addTo(lisbonMap);

const spots = [
  { lat: 38.7161, lng: -9.1506, place: "Mercado Campo de Ourique", avatar: "🌸", nick: "sol_dakar", originKey: "v1_origin", quoteKey: "v1_quote", wordKey: "v1_word", color: "#FF6B6B" },

];

function makePin(color, avatar) {
  return L.divIcon({
    className: '',
    html: `<div style="width:38px;height:38px;background:${color};border:2.5px solid #1E1B18;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:3px 3px 0 #1E1B18;display:flex;align-items:center;justify-content:center;cursor:pointer;"><span style="transform:rotate(45deg);font-size:15px;line-height:1;">${avatar}</span></div>`,
    iconSize: [38, 38], iconAnchor: [10, 38], popupAnchor: [9, -40]
  });
}

function buildPopup(spot, t) {
  return `<div style="font-family:'Nunito',sans-serif;min-width:210px;">
    <div style="font-size:11px;font-weight:800;color:#1E1B18;margin-bottom:7px;letter-spacing:.03em;">📍 ${spot.place}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <div style="width:34px;height:34px;border-radius:50%;border:2px solid #1E1B18;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:#FFF8F0;flex-shrink:0;">${spot.avatar}</div>
      <div>
        <div style="font-weight:800;font-size:13px;color:#1E1B18;">${spot.nick}</div>
        <div style="font-size:11px;color:#7A6E68;font-weight:600;">${t[spot.originKey] || ''}</div>
      </div>
    </div>
    <p style="font-style:italic;font-size:12px;line-height:1.6;color:#1E1B18;margin:0 0 8px;">${t[spot.quoteKey] || ''}</p>
    <span style="background:${spot.color};color:#1E1B18;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:800;border:2px solid #1E1B18;display:inline-block;">${t[spot.wordKey] || ''}</span>
  </div>`;
}

const markers = spots.map(spot => {
  const m = L.marker([spot.lat, spot.lng], { icon: makePin(spot.color, spot.avatar) }).addTo(lisbonMap);
  m._spotData = spot;
  return m;
});

document.getElementById('map-search').addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const q = this.value.trim();
  if (!q) return;
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ' Lisboa Portugal')}&limit=1&countrycodes=pt`)
    .then(r => r.json())
    .then(d => {
      if (!d.length) return;
      const lat = +d[0].lat, lng = +d[0].lon;
      const place = d[0].display_name.split(',')[0];
      lisbonMap.setView([lat, lng], 16);
      openAddModal(lat, lng, place);
    });
});

_quote:'"Esperé este autobús 40 veces antes de entender que el retraso era parte del ritmo de la ciudad."',v2_word:"Ritmo",v3_origin:"De Casablanca · 5 años en Lisboa",v3_quote:'"Mi hija aprendió a caminar en este jardín. Cuando vuelvo aquí sola, todavía escucho sus pasitos."',v3_word:"Raíces",map_search_ph:"Busca un lugar en Lisboa...",v4_origin:"De Brasil · 2 años en Lisboa",v4_quote:'"Vine aquí el primer día. Miré el Tajo y supe que me quedaba."',v4_word:"Llegada",v5_origin:"De Angola · 4 años en Lisboa",v5_quote:'"El fado de aquí no es para turistas. Es alguien llorando con la boca cerrada."',v5_word:"Saudade",cta_title:'¿Tienes una historia ligada a <span>Lisboa?</span>',cta_desc:'Toma un pin. Escribe una palabra. Colócala en tu lugar. <strong>Sin cuenta, sin datos, sin app.</strong> Solo tu voz y un lugar.',cta_btn1:"Quiero participar",cta_btn2:"Saber más",footer_sub:"Un proyecto de voces y memorias · Lisboa, Portugal",foot_about:"Sobre",foot_contact:"Contacto"},

de:{nav_how:"Wie es funktioniert",nav_stories:"Geschichten",nav_share:"Teile deine",hero_tag:"🗺 Lissabon · Echte Stimmen",hero_h1:'<span class="hl-pink">Die Stadt</span><br>in der wir <span class="hl-blue">leben</span><br><span class="hl-coral">zusammen</span>',hero_desc:'Eine Stadt ist nicht nur Straßen und Gebäude. Es sind <em>geteilte Routinen, Leben und Erinnerungen.</em> Egal woher du kommst — wir teilen dieselben Ecken.',hero_btn1:"Wie es funktioniert",hero_btn2:"Deine Geschichte teilen",stat1:"Geteilte Geschichten",stat2:"Orte in Lissabon",stat3:"Teile der Welt",stat4:"Persönliche Daten verlangt",q_title:'Was bedeutet <span>Lissabon</span> für dich?',q_sub:'Nimm eine Karte und eine farbige Nadel. Schreib ein Wort. Platziere sie an deinem Lieblingsort in Lissabon. <strong>So wird eine Stadt geschrieben — von allen, die sie Heimat nennen.</strong>',q_btn:"Schreib dein Wort",how_tag:"Wie es funktioniert",how_title:"Erkunde. Fühl. Teile.",step1_title:"Navigiere die Karte",step1_desc:"Erkunde die Lissabonner Karte und entdecke die von der Community markierten Orte.",step2_title:"Klicke auf einen Ort",step2_desc:"Lies die Einblicke, Gedanken und Emotionen, die Menschen hinterlassen haben — was die Stadt für sie bedeutet.",step3_title:"Teile deinen",step3_desc:"Füge deine eigene Perspektive hinzu. Ein Wort, eine Emotion, eine Erinnerung. Kein Konto, keine Daten.",pins_title:"Jede Farbe ist eine Welt",pins_sub:"Deine Nadelfarbe zeigt, woher du kommst — zusammen bilden sie die Weltkarte in Lissabon.",pin1:"Europa",pin2:"Asien",pin3:"Afrika",pin4:"Amerika",pin5:"Ozeanien",pin6:"Naher Osten",quote_text:'"Es ist nicht jeden Tag, dass wir die unsichtbaren Fäden sehen, die uns verbinden. <em>Diese Stadt wird von allen geschrieben, die sie Heimat nennen.</em>"',stories_tag:"Echte Geschichten",stories_title:"Was Lissabon für sie bedeutet.",v1_origin:"Aus Dakar · 3 Jahre in Lissabon",v1_quote:'"Jeden Dienstag komme ich für Gewürze. Der Geruch ist fast wie in Dakar. Fast."',v1_word:"Geruch",v2_origin:"Aus Neapel · 1 Jahr in Lissabon",v2_quote:'"Ich habe 40 Mal auf diesen Bus gewartet, bevor ich verstand, dass die Verspätung Teil des Stadtrhythmus ist."',v2_word:"Rhythmus",v3_origin:"Aus Casablanca · 5 Jahre in Lissabon",v3_quote:'"Meine Tochter hat in diesem Garten laufen gelernt. Wenn ich allein zurückkomme, höre ich noch ihre kleinen Schritte."',v3_word:"Wurzeln",map_search_ph:"Suche einen Ort in Lissabon...",v4_origin:"Aus Brasilien · 2 Jahre in Lissabon",v4_quote:'"Ich kam hier an meinem ersten Tag. Ich schaute auf den Tejo und wusste: ich bleibe."',v4_word:"Ankunft",v5_origin:"Aus Angola · 4 Jahre in Lissabon",v5_quote:'"Der Fado hier ist nicht für Touristen. Es ist jemand, der mit geschlossenem Mund weint."',v5_word:"Saudade",cta_title:'Hast du eine Geschichte die mit <span>Lissabon</span> verbunden ist?',cta_desc:'Nimm eine Nadel. Schreib ein Wort. Platziere es an deinem Ort. <strong>Kein Konto, keine Daten, keine App.</strong> Nur deine Stimme und ein Ort.',cta_btn1:"Ich will mitmachen",cta_btn2:"Mehr erfahren",footer_sub:"Ein Projekt aus Stimmen und Erinnerungen · Lissabon, Portugal",foot_about:"Über uns",foot_contact:"Kontakt"}

let lang = 'pt';

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lp').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lp[onclick="setLang('${l}')"]`).classList.add('active');
  document.documentElement.lang = l;
  const t = T[l];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (t[k] !== undefined) el.innerHTML = t[k];
  });
  document.getElementById('map-search').placeholder = t.map_search_ph || '';
  markers.forEach(m => m.bindPopup(buildPopup(m._spotData, t), { maxWidth: 250 }));
}

setLang('pt');

// ── SUPABASE ─────────────────────────────────────────────────
const SUPA_URL = 'https://lcnlrkyplqqbmqgoroij.supabase.co';
const SUPA_KEY = 'sb_publishable_B52IREdszV2Khe1wZohupQ_x5lq0k2t';
const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const CONTINENT_COLORS = {
  'Europa':'#FF6B6B','Ásia':'#38BFFF','África':'#4ADE80',
  'América':'#FFD700','Oceânia':'#C4B5FD','Médio Oriente':'#2DD4BF'
};

const addedPinIds = new Set();
let pendingLat = null, pendingLng = null, pendingPlace = '';

function openAddModal(lat, lng, place) {
  pendingLat = lat; pendingLng = lng; pendingPlace = place;
  document.getElementById('modal-place').textContent = '📍 ' + place;
  document.getElementById('pin-word').value = '';
  document.getElementById('pin-origin').value = '';
  document.getElementById('pin-quote').value = '';
  const btn = document.getElementById('modal-submit-btn');
  btn.disabled = false;
  btn.textContent = 'Adicionar ao mapa ✨';
  document.getElementById('add-pin-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('add-pin-modal').classList.remove('open');
}

function buildUserPopup(pin) {
  const color = CONTINENT_COLORS[pin.continent] || '#FFD700';
  return `<div style="font-family:'Nunito',sans-serif;min-width:200px;">
    <div style="font-size:11px;font-weight:800;color:#1E1B18;margin-bottom:7px;">📍 ${pin.place_name || 'Lisboa'}</div>
    <div style="font-size:12px;color:#7A6E68;font-weight:600;margin-bottom:6px;">${pin.origin}</div>
    ${pin.quote ? `<p style="font-style:italic;font-size:12px;line-height:1.6;color:#1E1B18;margin:0 0 8px;">"${pin.quote}"</p>` : ''}
    <span style="background:${color};color:#1E1B18;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:800;border:2px solid #1E1B18;display:inline-block;">${pin.word}</span>
  </div>`;
}

function addUserPinToMap(pin) {
  if (pin.id && addedPinIds.has(pin.id)) return;
  if (pin.id) addedPinIds.add(pin.id);
  const color = CONTINENT_COLORS[pin.continent] || '#FFD700';
  const m = L.marker([pin.lat, pin.lng], { icon: makePin(color, '✨') }).addTo(lisbonMap);
  m.bindPopup(buildUserPopup(pin), { maxWidth: 250 });
}

async function loadUserPins() {
  const { data } = await db.from('pins').select('*');
  if (data) data.forEach(addUserPinToMap);
}

async function submitPin() {
  const word = document.getElementById('pin-word').value.trim();
  const origin = document.getElementById('pin-origin').value.trim();
  if (!word || !origin) { alert('Palavra e origem são obrigatórios!'); return; }
  const btn = document.getElementById('modal-submit-btn');
  btn.disabled = true;
  btn.textContent = '...';
  const { data: inserted, error } = await db.from('pins').insert({
    lat: pendingLat, lng: pendingLng,
    place_name: pendingPlace,
    word, origin,
    continent: document.getElementById('pin-continent').value,
    quote: document.getElementById('pin-quote').value.trim() || null
  }).select();
  if (error) {
    btn.disabled = false;
    btn.textContent = 'Adicionar ao mapa ✨';
    alert('Erro ao guardar. Tenta de novo.');
    return;
  }
  if (inserted && inserted[0]) addUserPinToMap(inserted[0]);
  closeModal();
}

lisbonMap.on('click', async function(e) {
  const { lat, lng } = e.latlng;
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`);
  const d = await r.json();
  const place = d.address
    ? (d.address.road || d.address.suburb || d.address.neighbourhood || d.address.city_district || 'Lisboa')
    : 'Lisboa';
  openAddModal(lat, lng, place);
});

loadUserPins();
setInterval(loadUserPins, 10000);
</script>
